name: Swift

on: [push, pull_request]

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Swift Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v5
      - name: Swift Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  example-macos:
    name: ${{ matrix.example }} (macOS)
    runs-on: macos-26
    strategy:
      matrix:
        example: [POSIX-Smart-Lock, POSIX-Light-Bulb]
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        working-directory: Examples/${{ matrix.example }}
        run: swift build

  example-linux:
    name: ${{ matrix.example }} (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    strategy:
      matrix:
        example: [POSIX-Smart-Lock, POSIX-Light-Bulb]
    steps:
      - uses: actions/checkout@v5
      - name: Install BlueZ headers
        run: apt-get update && apt-get install -y libbluetooth-dev
      - name: Build
        working-directory: Examples/${{ matrix.example }}
        run: swift build
